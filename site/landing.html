<script>
(() => {
const $ = id => document.getElementById(id);
const map = L.map('map', { zoomControl: false, zoomSnap: 0.1, scrollWheelZoom: false, dragging: false, doubleClickZoom: false, keyboard: false,
                           boxZoom: false, touchZoom: false }).setView([12, 104], 4);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
  { maxZoom: 13, noWrap: true, bounds: [[-85, -180], [85, 180]], attribution: 'Esri, Maxar, Earthstar Geographics · Copernicus EMS GFM' }).addTo(map);
map.attributionControl.setPrefix('');
['flyTo', 'flyToBounds', 'fitBounds', 'setView'].forEach(fn => { const o = map[fn].bind(map); map[fn] = (...a) => { try { return o(...a); } catch (e) { return map; } }; });   // never let a camera move break a scene
const A = 'story/tonlesap/', B = L.latLngBounds([[12.3005, 103.5949], [13.2994, 104.7009]]);
const img = f => L.imageOverlay(A + f, B, { opacity: 0, interactive: false }).addTo(map);
const P = { photo: img('photo_2026-10-19.jpg'), excl: img('gfm_excluded.png'), gfm: img('gfm_flood.png'), add: img('nisar_added.png') };
const box = L.rectangle(B, { color: '#ffffff', weight: 2.5, dashArray: '6 5', fill: false, opacity: 0, interactive: false }).addTo(map);
let fast = false, mgen = 0;
const many = (os, v, step = 0) => { const g = mgen; os.forEach((o, k) => (fast || !step) ? vis(o, v) : setTimeout(() => g === mgen && vis(o, v), k * step)); };
const vis = (o, v) => o.setOpacity ? o.setOpacity(v) : o.setStyle({ opacity: v });
let sg = 0;                                   // scene generation: drops timers from a scene we left
const later = (fn, ms) => { if (fast) return fn(); const g = sg; setTimeout(() => g === sg && fn(), ms); };
function flash(o) {                            // blink a newly shown layer so it is clear what the text means
  if (fast) return vis(o, 1); const g = sg; [0.15, 1, 0.15, 1, 0.15, 1].forEach((v, k) => setTimeout(() => g === sg && vis(o, v), 230 * (k + 1)));
}
let on_ = [];
const show = on => { for (const k in P) { const was = on_.includes(k), now = on.includes(k); vis(P[k], now ? 1 : 0); if (now && !was) flash(P[k]); } on_ = on.slice(); };
const LG = { gfm: ['#2882ff', 'Flood seen by Sentinel-1 (GFM)'], excl: ['repeating-linear-gradient(45deg,#c8c8d2 0 2px,#3c3c46 2px 6px)', 'GFM: "cannot see here"'],
             add: ['#ff9a2e', 'Only NISAR: water in the blank'] };
const legend = ks => { $('lg').innerHTML = ks.map(k => `<div><i style="background:${LG[k][0]}"></i>${LG[k][1]}</div>`).join(''); $('lg').classList.toggle('in', ks.length > 0); };
let sayGen = 0;
function typeset(el, html, start) {          // each character fades in, one after another
  el.innerHTML = html || ''; let n = start;
  const walk = node => [...node.childNodes].forEach(c => {
    if (c.nodeType === 3) {
      const f = document.createDocumentFragment();
      for (const ch of c.textContent) { const sp = document.createElement('span'); sp.className = 'ch'; sp.textContent = ch;
        sp.style.animationDelay = (n++ * 18) + 'ms'; f.appendChild(sp); }
      c.replaceWith(f);
    } else walk(c);
  });
  walk(el);
  el.querySelectorAll('b.gy').forEach(b => { const c = b.querySelector('.ch'); if (c) b.style.setProperty('--d', c.style.animationDelay); });  // background fades in with its text
  return n;
}
function say(k, h, s, tag) {
  const g = ++sayGen;
  [$('k'), $('h'), $('s')].forEach(e => e.classList.remove('in'));
  setTimeout(() => { if (g !== sayGen) return;
    $('k').textContent = k || ''; let n = typeset($('h'), h, 0); typeset($('s'), s, n + 10);
    [$('k'), $('h'), $('s')].forEach(e => e.classList.add('in')); }, 300);
  $('tag').classList.toggle('in', !!tag); if (tag) $('tag').textContent = tag;
}
const H = t => `<h1>${t}</h1>`, BIG = (n, u, c = '') => `<div class="big ${c}">${n}<small> ${u}</small></div>`;
const fit = () => map.flyToBounds(B, { duration: 3, paddingTopLeft: [innerWidth * .38, 20], paddingBottomRight: [20, 20] });

const QS = [ // name, lat, lon, NISAR km² in GFM's blank (wettest pass), % vs GFM flood (null if GFM < 5 km²)
  ['Tonle Sap', 12.8, 104.15, 561, 101], ['Inner Niger Delta', 14.9, -4.3, 253, 493], ['Mekong delta', 10.7, 105.3, 170, 24], ['Irrawaddy delta', 16.6, 95.3, 76, 8],
  ['Congo basin', 0.5, 17.6, 75, null], ['Sylhet', 24.7, 91.4, 13, 4], ['Amazon várzea', -3.0, -64.9, 11, null], ['Assam', 26.6, 92.5, 10, 95], ['Thailand', 13.65, 101.0, 7, 30],
  ['Hubei', 30.8, 111.0, 5, null], ['Nepal', 27.3, 85.4, 1, 16], ['Tamil Nadu', 11.3, 78.6, 0, null], ['Atchafalaya', 30.25, -91.4, 0, null]];
const NOCMP = [['Okavango', -19.3, 22.9], ['Pantanal', -18.5, -57.1], ['Sudd', 7.3, 30.6]];   // no GFM–NISAR overlap
const SIDE = { 'Tonle Sap': 't', 'Mekong delta': 'rb', 'Irrawaddy delta': 'l', 'Inner Niger Delta': 'r', 'Congo basin': 'r' };
const mk = (la, lo, html) => L.marker([la, lo], { icon: L.divIcon({ className: '', html, iconSize: [12, 12], iconAnchor: [6, 6] }), opacity: 0, interactive: false }).addTo(map);
const plain = QS.concat(NOCMP).map(([n, la, lo]) => mk(la, lo, '<div class="rd"></div>'));
const dots = QS.map(([n, la, lo, km, pc]) => mk(la, lo, `<div class="rd"></div>` + (SIDE[n] ? `<div class="rdl ${SIDE[n]}">${n}<br><b>+${km} km²</b>${pc != null ? ` · +${pc}%` : ''}</div>` : '')))
  .concat(NOCMP.map(([n, la, lo]) => mk(la, lo, '<div class="rd" style="background:#888;box-shadow:none"></div>')));
const THUMBS = [ // site key, name, dot, card position (ocean)
  ['tonle-sap', 'Tonle Sap', [12.8, 104.15], [-8, 112]], ['inner-niger-delta-mali', 'Inner Niger Delta', [14.9, -4.3], [24, -38]],
  ['mekong-delta-vietnam', 'Mekong delta', [10.7, 105.3], [22, 140]], ['congo-cuvette-centrale', 'Congo basin', [0.5, 17.6], [-14, -12]]];
const thumbs = THUMBS.flatMap(([k, n, dot, at]) => [
  L.polyline([dot, at], { color: '#fff', weight: 1, opacity: 0, dashArray: '3 4', interactive: false }).addTo(map),
  L.marker(at, { icon: L.divIcon({ className: '', html: `<div class="th"><img src="story/world/thumbs/${k}.jpg"><span>${n}</span></div>`, iconSize: [130, 145], iconAnchor: [65, 72] }), opacity: 0, interactive: false }).addTo(map)]);
const TOUR = [['inner-niger-delta-mali', 'Inner Niger Delta', 'Mali · 16 Sep 2026', 253], ['mekong-delta-vietnam', 'Mekong delta', 'Vietnam · 23 Sep 2026', 170],
              ['irrawaddy-delta-myanmar', 'Irrawaddy delta', 'Myanmar · 17 Jul 2026', 76], ['congo-cuvette-centrale', 'Congo basin', 'Rep. of Congo · 19 Oct 2026', 75]];
let TJ = {};
let TL = [];
function tourSite(key) {
  TL.forEach(o => map.removeLayer(o)); TL = [];
  const c = TJ[key] && TJ[key].corners; if (!c) return;
  const Bk = L.latLngBounds([[c[1][1], c[0][0]], [c[0][1], c[1][0]]]);
  TL = ['gfm_excluded.png', 'gfm_flood.png', 'nisar_added.png'].map(f => L.imageOverlay(`story/world/${key}/${f}`, Bk, { opacity: 0, interactive: false }).addTo(map));
  map.flyToBounds(Bk, { duration: 2.2, paddingTopLeft: [innerWidth * .32, 20], paddingBottomRight: [20, 20] });
  setTimeout(() => TL.forEach(o => o.setOpacity(1)), 2200);
}
const PB = L.latLngBounds([[58.3001, -111.8129], [58.8996, -111.0007]]);
const CA = { nw: L.imageOverlay('story/canada/nisar_water.png', PB, { opacity: 0, interactive: false }).addTo(map),
             rw: L.imageOverlay('story/canada/rcm_water.png', PB, { opacity: 0, interactive: false }).addTo(map),
             ag: L.imageOverlay('story/canada/agree.png', PB, { opacity: 0, interactive: false }).addTo(map) };
const ca = on => { for (const k in CA) { vis(CA[k], on.includes(k) ? 1 : 0); if (on.includes(k)) flash(CA[k]); } };
LG.nw = ['#2882ff', 'Water · NISAR (10 Oct)']; LG.rw = ['#ff5050', 'Water · Canada\'s RCM (13 Oct)'];
LG.both = ['#f5f5f5', 'Both see water']; LG.on = ['#2882ff', 'Only NISAR']; LG.or = ['#ff5050', 'Only RCM'];
const world = () => { document.body.classList.add('wv'); map.flyToBounds([[-50, -125], [62, 160]], { duration: 3 }); };

const T_ = { // tour sentences
  'Inner Niger Delta': 'In Mali\'s Inner Niger Delta (16 Sep), NISAR found <b>253 km²</b> of water where the official map was blank, on its wettest NISAR pass.',
  'Mekong delta': 'In the Mekong delta in Vietnam (23 Sep), NISAR found <b>170 km²</b> of water where the official map was blank, on its wettest NISAR pass.',
  'Irrawaddy delta': 'In Myanmar\'s Irrawaddy delta (17 Jul), NISAR found <b>76 km²</b> of water where the official map was blank, on its wettest NISAR pass.',
  'Congo basin': 'In the Congo basin (19 Oct), NISAR found <b>75 km²</b> of water where the official map was blank, on its wettest NISAR pass.' };
const V = $('vid');                            // opening video: real footage of Tonle Sap (CC BY-SA 4.0; credit on screen); shrinks onto the map
V.oncanplay = () => V.classList.add('ok'); V.onerror = () => V.classList.remove('ok');
V.src = 'story/tonle.mp4';
const TS = [12.8, 104.15];
function vidCard(on) {                          // full screen <-> a framed card pinned on Tonle Sap
  if (!on) { V.classList.remove('card', 'pin'); Object.assign(V.style, { left: '0px', top: '0px', width: '100%', height: '100%' }); return; }
  const p = map.latLngToContainerPoint(TS), w = 260, h = 146;
  if (!V.classList.contains('card')) setTimeout(() => V.classList.contains('card') && V.classList.add('pin'), 1900);
  V.classList.add('card'); Object.assign(V.style, { left: (p.x - w / 2) + 'px', top: (p.y - h - 18) + 'px', width: w + 'px', height: h + 'px' });
}
map.on('move moveend resize', () => V.classList.contains('card') && vidCard(true));   // keep the card on the lake
const vid = on => { if (!on) setTimeout(() => !document.body.classList.contains('vid') && vidCard(false), 1300); document.body.classList.toggle('vid', on); if (on) V.play().catch(() => {}); else setTimeout(() => !document.body.classList.contains('vid') && V.pause(), 2000); };
const scenes = [
  [6.5, () => { map.setView([12.8, 104.15], 9, { animate: false }); vid(true);
              say('Tonle Sap, Cambodia', H('Every rainy season, this lake grows about six times bigger and floods the forest around it.')); }],
  [7, () => { vid(true); vidCard(true); later(() => { world(); many(plain, 1, 60); }, 1900);
              say('', H('1.8 billion people live where floods like this can reach them.'), '', 'World Bank · Rentschler et al., Nature Comms 2022'); }],
  [6.5, () => { say('Flood maps', H('Satellites watch them. Every few days, Europe\'s Copernicus service maps floods worldwide with Sentinel-1 radar.'), '', 'Copernicus EMS · GFM'); }],
  [7, () => { vid(false); many(plain, 0); document.body.classList.remove('dim', 'wv'); fit(); show([]); later(() => { flash(box); show(['gfm']); legend(['gfm']); }, 3100);
              say('Tonle Sap · 17 Oct 2026', H('Back at Tonle Sap. On 17 October, the official map showed <b class="bl">554 km²</b> of flooding around the lake.'), '', 'Copernicus EMS · GFM'); }],
  [7, () => { show(['gfm', 'excl']); legend(['gfm', 'excl']); say('', H('But a quarter of the area is marked <b class="gy">"cannot see"</b>. Under the trees, this radar can\'t see the water.'), '', 'GFM exclusion mask'); }],
  [7, () => { show(['photo']); legend([]);
              say('Camera · 19 Oct', H('Cameras don\'t fill the gap. Two days later, Landsat and Sentinel-2 saw clouds, and under the trees only green.'), '', 'Optical · NASA HLS (Landsat + Sentinel-2)'); }],
