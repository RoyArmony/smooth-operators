# Deploys the site to Vercel on every push to main, as the Vercel project owner (Hobby plan:
# Vercel's own Git deploys only accept the owner's commits on a private repo).
# Needs repo secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID.
name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v5

      # Without git metadata Vercel doesn't check the commit author, so anyone's push deploys.
      - name: Drop git metadata
        run: rm -rf .git

      # TEMP diagnostics: a value shown as *** equals one of the secrets (match). Remove once deploys work.
      - name: Check Vercel access
        run: |
          api() { curl -s -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com$1"; }
          echo "Secret lengths: token=${#VERCEL_TOKEN} org=${#VERCEL_ORG_ID} project=${#VERCEL_PROJECT_ID}"
          echo "--- Token user:"; api /v2/user | jq -r 'if .error then "ERROR \(.error.message)" else .user | "\(.username) id=\(.id) defaultTeamId=\(.defaultTeamId)" end'
          echo "--- Teams the token sees:"; api /v2/teams | jq -r 'if .error then "ERROR \(.error.message)" else .teams[] | "\(.slug) id=\(.id)" end'
          echo "--- Projects under VERCEL_ORG_ID:"; api "/v9/projects?teamId=$VERCEL_ORG_ID&limit=50" | jq -r 'if .error then "ERROR \(.error.message)" else .projects[] | "\(.name) id=\(.id)" end'
          echo "--- VERCEL_PROJECT_ID lookup:"; api "/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID" | jq -r 'if .error then "ERROR \(.error.message)" else "found: \(.name) accountId=\(.accountId)" end'
          true

      # .vercelignore still decides which files are uploaded.
      - name: Deploy (production)
        run: npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"
